<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kicker's Club - log the wall kicks done at home.">
<title>Kicker&#39;s Club</title>
<style>
:root{color-scheme:light;--bg:#F4ECD8;--card:#FBF6E8;--tan:#EDE0BF;--rule:#D2C09C;--rule-hi:#B9A275;
--text:#241608;--sec:#46331C;--muted:#6B5334;--rust:#7A3E0F;--forest:#1F5A34;--warn:#7A4A08;--fs:19px;
--font:Verdana,Tahoma,"DejaVu Sans",Geneva,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.6;overflow-wrap:break-word}
.wrap{max-width:660px;margin:0 auto;padding:26px 18px 70px}
.mast{border-bottom:3px solid var(--rust);padding-bottom:16px;margin-bottom:20px}
.eyebrow{font-size:.7em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:1.7em;font-weight:700;text-transform:uppercase;color:var(--rust);margin:8px 0 10px;line-height:1.1}
.sub{font-size:.92em;color:var(--sec);max-width:56ch}
.card{background:var(--card);border:1px solid var(--rule-hi);border-radius:6px;padding:20px;margin-bottom:16px}
h2{font-size:.9em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--rust);
border-bottom:1px solid var(--rule);padding-bottom:9px;margin-bottom:14px}
label{display:block;font-size:.72em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
label:first-of-type{margin-top:0}
select,input,textarea{font-family:inherit;font-size:1em;width:100%;padding:12px;border:1px solid var(--rule-hi);
border-radius:5px;background:#fff;color:var(--text);min-height:48px}
textarea{min-height:96px;font-size:.8em;line-height:1.45;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
button{font-family:inherit;font-size:.85em;font-weight:700;cursor:pointer;border-radius:5px;padding:13px 20px;
min-height:48px;border:1px solid var(--rust);background:var(--rust);color:var(--card)}
button:hover{background:var(--text);border-color:var(--text)}
button[disabled]{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--rust)}
button.ghost:hover{background:var(--tan);color:var(--rust)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.note{font-size:.82em;color:var(--sec);margin-top:12px}
.ok{background:#EDF3E6;border:1px solid var(--forest);color:var(--forest);border-radius:5px;padding:13px 16px;font-size:.86em;font-weight:700;margin-bottom:16px}
.warn{background:#F8EFDC;border:1px solid var(--warn);color:var(--warn);border-radius:5px;padding:13px 16px;font-size:.84em;margin-bottom:16px}
.warn b{display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{background:var(--tan);color:var(--rust);font-size:.68em;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:10px 11px;border-bottom:2px solid var(--rule-hi)}
td{padding:11px;border-bottom:1px solid var(--rule);font-size:.86em;color:var(--sec)}
tr:last-child td{border-bottom:none}
td.k{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.rank{width:34px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
td.nm{font-weight:700;color:var(--text)}
.bar{height:8px;border-radius:4px;background:var(--rust);margin-top:5px}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tile{background:var(--tan);border-radius:5px;padding:10px 15px;font-size:.8em;color:var(--sec)}
.tile b{display:block;font-size:1.5em;color:var(--rust);font-variant-numeric:tabular-nums}
.mine{font-size:.88em;color:var(--sec);margin-top:10px}
.mine b{color:var(--rust);font-size:1.2em}
.log{font-size:.8em;color:var(--muted);margin-top:10px}
.log span{display:inline-block;background:var(--tan);border-radius:4px;padding:3px 9px;margin:3px 4px 0 0}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);font-size:.76em;color:var(--muted)}
.foot a{color:var(--rust);font-weight:700}
.linky{background:none;border:none;color:var(--rust);font-weight:700;font-size:.78em;text-decoration:underline;cursor:pointer;padding:6px 2px;min-height:auto}
.status{font-size:.74em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.status.live{color:var(--forest)}
.status.off{color:var(--warn)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:baseline}
code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:var(--tan);padding:2px 5px;border-radius:3px;word-break:break-all}
.mini{font-size:.74em;padding:7px 11px;min-height:36px}
.adj{width:104px;padding:8px 10px;font-size:.9em;text-align:right}
button.danger{border-color:#8B1A1A;color:#8B1A1A;background:transparent}
button.danger:hover{background:#8B1A1A;color:#fff;border-color:#8B1A1A}
td.act{text-align:right;white-space:nowrap}
td.k abbr{color:var(--rust);text-decoration:none;margin-left:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<header class="mast">
  <div class="eyebrow">SBMSA 8U Girls</div>
  <h1>Kicker&rsquo;s Club</h1>
  <p class="sub">Log the passes she does against a wall at home. A wall never misses, never gets bored, and
  sends the ball back at exactly the pace she hit it &mdash; which is why it is the fastest way to fix a weak pass.</p>
</header>

<div id="root"></div>

<div class="foot">
  <button class="linky" id="coachlink">Coach login</button>
  &nbsp;&middot;&nbsp; <a href="index.html">Practice book</a>
</div>

</div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     The API is a Cloudflare Pages Function living at /api/entries on this
     same origin, so this is an ordinary fetch: no CORS, no preflight.

     Where it answers, every parent writes to one shared store and the coach
     sees the same leaderboard on every phone.

     Where it does not answer — no signal, or a host with no Functions — an
     entry is neither lost nor turned into homework for the parent. It waits
     on the phone and sends itself the next time the page opens with a
     connection.
     ------------------------------------------------------------------ */
  var API = '/api/entries';

  var NAMES = ["Abigael","Annabel","Annie","Catherine","Dafne","Davy","Helen","Louise","Madeline C.","Madeline S.","Riley W.","Riley Y."];
  var PASS = 'coach8u';           // hides the coach screen from a casual tap
  var KEY = 'coach8u';            // and guards the coach's writes at the API
  var QUEUE = 'wk.queue.v1';      // entries the team list has not taken yet
  var OLDLOG = 'wk.mine.v1';      // where this phone used to keep its own log
  var OLDPOOL = 'wk.pool.v1';     // and where the coach used to paste codes

  var root = document.getElementById('root');
  var view = 'parent';
  var flash = null;
  var server = [];                // entries from the team list
  var adjust = {};                // the coach's corrections, by player
  var link = 'connecting';        // connecting | live | down
  var busy = false;
  var editP = null;               // whose total the coach is editing
  var resetArmed = false, resetTimer = null;

  function live() { return link === 'live'; }

  /* ---------- storage ---------- */

  function read(key) {
    try { var v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function write(key, v) {
    try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; }
  }
  function storageWorks() {
    try { localStorage.setItem('wk.t', '1'); localStorage.removeItem('wk.t'); return true; }
    catch (e) { return false; }
  }

  /* ---------- helpers ---------- */

  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }
  function pretty(iso) {
    var p = String(iso).split('-');
    if (p.length !== 3) return iso;
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return Number(p[2]) + ' ' + (m[Number(p[1]) - 1] || '') + ' ' + p[0];
  }
  function keyOf(e) { return e.p + '|' + e.d + '|' + e.k; }
  function merge(a, b) {
    var seen = {}, out = [];
    a.concat(b).forEach(function (e) {
      if (!e || !e.p) return;
      var k = keyOf(e);
      if (seen[k]) return;
      seen[k] = 1; out.push(e);
    });
    return out;
  }

  /* A correction is the gap between what was logged and what the coach says
     the total is. Adding it here moves the number without rewriting a single
     thing a parent actually entered, so "times logged" stays honest. */
  function totals(entries) {
    var by = {};
    NAMES.forEach(function (n) { by[n] = { kicks: 0, times: 0, last: null, fixed: false }; });
    entries.forEach(function (e) {
      if (!by[e.p]) by[e.p] = { kicks: 0, times: 0, last: null, fixed: false };
      by[e.p].kicks += Number(e.k) || 0;
      by[e.p].times += 1;
      if (!by[e.p].last || e.d > by[e.p].last) by[e.p].last = e.d;
    });
    Object.keys(adjust).forEach(function (n) {
      if (!by[n]) by[n] = { kicks: 0, times: 0, last: null, fixed: false };
      by[n].kicks += Number(adjust[n]) || 0;
      by[n].fixed = true;
      if (by[n].kicks < 0) by[n].kicks = 0;
    });
    return by;
  }

  /** Everything we know about: the team list, plus anything still waiting. */
  function allEntries() {
    return merge(server, read(QUEUE));
  }

  /* Kicks logged before this page could save them for the team were kept in
     their own corner of the phone. Move them into the queue once so they go
     up with everything else instead of being stranded. */
  function adoptOldLog() {
    var old = merge(read(OLDLOG), read(OLDPOOL));
    if (!old.length) return;
    write(QUEUE, merge(read(QUEUE), old));
    try { localStorage.removeItem(OLDLOG); localStorage.removeItem(OLDPOOL); } catch (e) { }
  }

  /* ---------- talking to the API ---------- */

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function apiGet() {
    return fetch(API, { method: 'GET', headers: { 'accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); });
  }

  function apiSend(body) {
    return fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); });
  }

  function apiPost(entry) {
    return apiSend({ id: entry.id, p: entry.p, d: entry.d, k: entry.k });
  }

  /** What comes back from the API is the truth about the team list. */
  function take(res) {
    if (!res || !res.ok) return false;
    if (Array.isArray(res.entries)) server = res.entries;
    adjust = (res.adjust && typeof res.adjust === 'object') ? res.adjust : {};
    link = 'live';
    return true;
  }

  /** One probe on load decides which world we are in. */
  function probe() {
    apiGet().then(function (res) {
      if (take(res)) { render(); flushQueue(); }
      else { link = 'down'; render(); }
    }, function () {
      link = 'down'; render();
    });
  }

  function refresh(then) {
    apiGet().then(function (res) {
      if (!take(res)) link = 'down';
      render(); then && then();
    }, function () { link = 'down'; render(); then && then(); });
  }

  /** Anything logged while the connection was down goes on the next chance. */
  function flushQueue() {
    if (!live()) return;
    var q = read(QUEUE);
    if (!q.length) return;
    apiPost(q[0]).then(function (res) {
      if (take(res)) {
        write(QUEUE, read(QUEUE).slice(1));
        render();
        flushQueue();
      }
    }, function () { /* still no connection; try again next load */ });
  }

  /* ---------- parent ---------- */

  function statusLine() {
    var q = read(QUEUE).length;
    if (link === 'connecting') return '<div class="status"><span class="dot"></span>Checking the team list…</div>';
    if (live()) return '<div class="status live"><span class="dot"></span>Saved online for the whole team</div>';
    return '<div class="status off"><span class="dot"></span>Cannot reach the team list' +
      (q ? ' &mdash; ' + q + ' waiting to send' : '') + '</div>';
  }

  function parentView() {
    var entries = allEntries();
    var by = totals(entries);
    var h = '';

    if (flash) h += '<div class="' + flash.kind + '">' + flash.msg + '</div>';
    if (!storageWorks()) {
      h += '<div class="warn"><b>This browser is not saving anything.</b>Private or incognito mode blocks ' +
           'storage, so a kick logged with no connection would be lost. Open this page in a normal window.</div>';
    }

    var opts = ['<option value="">&mdash; choose &mdash;</option>'].concat(NAMES.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
    })).join('');

    h += '<div class="card">' + statusLine() + '<h2>Log some kicks</h2>' +
      '<label for="who">Who kicked?</label><select id="who">' + opts + '</select>' +
      '<label for="when">What day?</label><input id="when" type="date" value="' + today() + '">' +
      '<label for="howmany">How many wall kicks?</label>' +
      '<input id="howmany" type="number" min="1" max="5000" step="1" inputmode="numeric" placeholder="e.g. 20">' +
      '<div class="row"><button id="save"' + (busy ? ' disabled' : '') + '>' +
      (busy ? 'Saving…' : 'Save it') + '</button></div>' +
      '<div id="mine"></div>' +
      '<p class="note">Twenty passes against a wall counts as twenty kicks. Log it whenever she does it &mdash; ' +
      'a few minutes a week adds up faster than anything we can do at practice. Nothing else to do: ' +
      'the page tells the coach.</p></div>';

    var sum = 0;
    NAMES.forEach(function (n) { sum += by[n].kicks; });
    var times = entries.length;
    h += '<div class="tot"><div class="tile"><b>' + sum + '</b>kicks by the team</div>' +
         '<div class="tile"><b>' + times + '</b>times logged</div></div>';

    root.innerHTML = h;
    flash = null;

    var who = document.getElementById('who');
    who.addEventListener('change', function () {
      var t = by[who.value], box = document.getElementById('mine');
      if (!who.value || !t || !t.times) { box.innerHTML = ''; return; }
      var recent = entries.filter(function (e) { return e.p === who.value; })
        .sort(function (a, b) { return a.d < b.d ? 1 : -1; }).slice(0, 6);
      box.innerHTML = '<div class="mine">' + esc(who.value) + ' has <b>' + t.kicks + '</b> kicks</div>' +
        '<div class="log">' +
        recent.map(function (e) { return '<span>' + esc(pretty(e.d)) + ' &middot; ' + e.k + '</span>'; }).join('') +
        '</div>';
    });

    document.getElementById('save').addEventListener('click', save);
  }

  function save() {
    var who = document.getElementById('who').value;
    var when = document.getElementById('when').value;
    var n = parseInt(document.getElementById('howmany').value, 10);

    if (!who) { flash = { kind: 'warn', msg: 'Pick who kicked first.' }; return render(); }
    if (!when) { flash = { kind: 'warn', msg: 'Pick a date.' }; return render(); }
    if (isNaN(n) || n < 1) { flash = { kind: 'warn', msg: 'How many kicks? A whole number, at least 1.' }; return render(); }

    var entry = { id: uid(), p: who, d: when, k: n, ts: Date.now() };
    var said = esc(who) + ', ' + n + ' kicks on ' + esc(pretty(when)) + '.';

    busy = true; render();
    apiPost(entry).then(function (res) {
      busy = false;
      if (take(res)) flash = { kind: 'ok', msg: 'Saved for the whole team &mdash; ' + said };
      else keep(entry, said);
      render();
    }, function () {
      busy = false; link = 'down';
      keep(entry, said);
      render();
    });
  }

  /** No connection: hold it here and say so, without asking the parent to do
      anything about it. */
  function keep(entry, said) {
    var q = read(QUEUE);
    q.push(entry);
    if (!write(QUEUE, q)) {
      flash = { kind: 'warn', msg: 'This browser would not save it. Try a normal (not private) window.' };
      return;
    }
    flash = { kind: 'warn', msg: 'Kept on this phone &mdash; ' + said +
      ' It sends itself the next time you open this page with a connection.' };
  }

  /* ---------- coach ---------- */

  function gateView() {
    root.innerHTML = '<div class="card"><h2>Coach login</h2>' +
      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="off">' +
      '<div class="row"><button id="go">See the leaderboard</button>' +
      '<button class="ghost" id="back">Back</button></div>' +
      '<p class="note">This only hides the page from a casual tap. It is not real security &mdash; ' +
      'anything on this page can be read by anyone who has the link.</p></div>';
    var pw = document.getElementById('pw');
    function go() {
      if (pw.value === PASS) { view = 'board'; if (live()) refresh(); else render(); }
      else { pw.value = ''; pw.placeholder = 'Not that one'; pw.focus(); }
    }
    document.getElementById('go').addEventListener('click', go);
    pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    document.getElementById('back').addEventListener('click', function () { view = 'parent'; render(); });
    pw.focus();
  }

  function armReset(on) {
    resetArmed = on;
    clearTimeout(resetTimer);
    if (on) resetTimer = setTimeout(function () { resetArmed = false; render(); }, 6000);
  }

  function boardView() {
    var entries = allEntries();
    var by = totals(entries);
    var canEdit = live();
    var rows = NAMES.map(function (n) {
      return { n: n, k: by[n].kicks, t: by[n].times, last: by[n].last, fixed: by[n].fixed };
    }).sort(function (a, b) { return b.k - a.k || a.n.localeCompare(b.n); });

    var top = rows.length ? rows[0].k : 0;
    var sum = rows.reduce(function (s, r) { return s + r.k; }, 0);
    var logging = rows.filter(function (r) { return r.t > 0 || r.fixed; }).length;

    var h = '';
    if (flash) h += '<div class="' + flash.kind + '">' + flash.msg + '</div>';
    h += statusLine();
    h += '<div class="tot"><div class="tile"><b>' + sum + '</b>kicks in total</div>' +
      '<div class="tile"><b>' + logging + ' / ' + NAMES.length + '</b>girls logging</div></div>';

    h += '<div class="card" style="padding:0;overflow:hidden"><table>' +
      '<thead><tr><th></th><th>Player</th><th>Times</th><th>Last</th>' +
      '<th style="text-align:right">Kicks</th>' + (canEdit ? '<th></th>' : '') +
      '</tr></thead><tbody>';

    rows.forEach(function (r, i) {
      if (canEdit && editP === r.n) {
        h += '<tr><td class="rank"></td><td class="nm">' + esc(r.n) + '</td>' +
          '<td colspan="2">Set the total to</td>' +
          '<td class="k"><input class="adj" id="adjval" type="number" min="0" max="1000000" ' +
          'step="1" inputmode="numeric" value="' + r.k + '"></td>' +
          '<td class="act"><button class="mini" id="adjsave">Save</button> ' +
          '<button class="mini ghost" id="adjcancel">Cancel</button></td></tr>';
        return;
      }
      var w = top > 0 ? Math.round(r.k / top * 100) : 0;
      h += '<tr><td class="rank">' + (r.k > 0 ? (i + 1) : '') + '</td>' +
        '<td class="nm">' + esc(r.n) + (r.k > 0 ? '<div class="bar" style="width:' + w + '%"></div>' : '') + '</td>' +
        '<td>' + (r.t || '&mdash;') + '</td>' +
        '<td>' + (r.last ? esc(pretty(r.last)) : '&mdash;') + '</td>' +
        '<td class="k">' + r.k + (r.fixed ? '<abbr title="you corrected this total">*</abbr>' : '') + '</td>' +
        (canEdit ? '<td class="act"><button class="mini ghost" data-adj="' + esc(r.n) + '">Adjust</button></td>' : '') +
        '</tr>';
    });
    h += '</tbody></table></div>';

    if (canEdit) {
      h += '<div class="row"><button id="reload">Refresh</button>' +
        '<button class="ghost" id="back">Back to the form</button>' +
        '<button class="' + (resetArmed ? 'danger' : 'ghost') + '" id="reset">' +
        (resetArmed ? 'Tap again to wipe everything' : 'Reset the record') + '</button></div>' +
        '<div class="foot">Every entry a parent makes lands here, so this is the same leaderboard on ' +
        'every phone. <b>Adjust</b> sets a girl&rsquo;s total to whatever it should be without ' +
        'rewriting what anybody logged &mdash; a star marks a total you have corrected. ' +
        '<b>Reset the record</b> wipes every entry and every correction for the whole team, and ' +
        'cannot be undone.</div>';
    } else {
      h += '<div class="row"><button class="ghost" id="back">Back to the form</button></div>' +
        '<div class="foot">The team list cannot be reached from here, so this is only what this phone ' +
        'is holding. Adjusting a total and resetting the record both need the connection.</div>';
    }

    root.innerHTML = h;
    flash = null;

    if (document.getElementById('reload')) {
      document.getElementById('reload').addEventListener('click', function () { armReset(false); refresh(); });
    }

    Array.prototype.forEach.call(root.querySelectorAll('[data-adj]'), function (b) {
      b.addEventListener('click', function () {
        armReset(false);
        editP = b.getAttribute('data-adj');
        render();
        var box = document.getElementById('adjval');
        if (box) { box.focus(); box.select(); }
      });
    });

    if (document.getElementById('adjsave')) {
      var box = document.getElementById('adjval');
      var who = editP;
      var send = function () {
        var v = parseInt(box.value, 10);
        if (isNaN(v) || v < 0) { box.focus(); return; }
        busy = true;
        apiSend({ op: 'set', p: who, k: v, key: KEY }).then(function (res) {
          busy = false;
          if (take(res)) {
            editP = null;
            flash = { kind: 'ok', msg: esc(who) + ' is now on ' + v + ' kicks.' };
          } else {
            flash = { kind: 'warn', msg: 'That did not go through. Try again in a moment.' };
          }
          render();
        }, function () {
          busy = false; link = 'down';
          flash = { kind: 'warn', msg: 'No connection just now, so nothing was changed.' };
          render();
        });
      };
      document.getElementById('adjsave').addEventListener('click', send);
      box.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
      document.getElementById('adjcancel').addEventListener('click', function () {
        editP = null; render();
      });
    }

    if (document.getElementById('reset')) {
      document.getElementById('reset').addEventListener('click', function () {
        if (!resetArmed) { armReset(true); render(); return; }
        armReset(false);
        apiSend({ op: 'reset', key: KEY }).then(function (res) {
          if (take(res)) {
            write(QUEUE, []);
            flash = { kind: 'ok', msg: 'The record is empty. Everybody starts from nothing.' };
          } else {
            flash = { kind: 'warn', msg: 'That did not go through. Nothing was wiped.' };
          }
          render();
        }, function () {
          link = 'down';
          flash = { kind: 'warn', msg: 'No connection just now. Nothing was wiped.' };
          render();
        });
      });
    }

    document.getElementById('back').addEventListener('click', function () {
      armReset(false); editP = null; view = 'parent'; render();
    });
  }

  function render() {
    if (view === 'gate') gateView();
    else if (view === 'board') boardView();
    else parentView();
  }

  document.getElementById('coachlink').addEventListener('click', function () {
    armReset(false); editP = null;
    view = (view === 'parent') ? 'gate' : 'parent';
    render();
  });

  adoptOldLog();
  render();
  probe();
})();
</script>
</body>
</html>
